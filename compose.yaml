services:
  zags-ui-tests:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    init: true
    shm_size: "2gb"
    environment:
      BASE_URL: ${BASE_URL}
      APP_USERNAME: ${APP_USERNAME}
      APP_PASSWORD: ${APP_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA}
    volumes:
      - ./target:/app/target